<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Degradados -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="70%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#05070c" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="30%" stop-color="#f59e0b" />
      <stop offset="70%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="goldBorder" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#78350f" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>
    <!-- Filtros de Sombra y Resplandor -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Fondo circular principal -->
  <circle cx="256" cy="256" r="236" fill="url(#bgGrad)" stroke="url(#goldBorder)" stroke-width="6" filter="url(#shadow)" />
  
  <!-- Detalles decorativos: Anillo interior sutil -->
  <circle cx="256" cy="256" r="216" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.25" />

  <!-- Monograma NTB en el centro -->
  <g transform="translate(256, 274)" text-anchor="middle" filter="url(#shadow)">
    <!-- Texto principal "NTB" -->
    <text font-family="'Plus Jakarta Sans', 'Instrument Sans', 'Playfair Display', sans-serif" font-size="112" font-weight="800" letter-spacing="4" fill="url(#goldGrad)" style="text-transform: uppercase;">NTB</text>
  </g>

  <!-- Destello estelar decorativo (Estrella de cuatro puntas) -->
  <path d="M 370 150 Q 370 180 400 180 Q 370 180 370 210 Q 370 180 340 180 Q 370 180 370 150 Z" fill="url(#goldGrad)" filter="url(#glow)" />
  <!-- Pequeño destello extra -->
  <circle cx="370" cy="180" r="4" fill="#ffffff" />
  
  <path d="M 140 320 Q 140 335 155 335 Q 140 335 140 350 Q 140 335 125 335 Q 140 335 140 320 Z" fill="url(#goldGrad)" opacity="0.8" />
</svg>
